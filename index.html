<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>Screen Recorder</h1>
            <p class="subtitle">Enregistrez votre écran en quelques clics</p>
        </header>

        <main>
            <div class="preview-container">
                <video id="preview" autoplay muted playsinline></video>
                <div class="preview-placeholder" id="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span>Aperçu de l'écran</span>
                </div>
                <div class="recording-indicator" id="recordingIndicator">
                    <span class="rec-dot"></span>
                    <span class="rec-text">REC</span>
                    <span class="rec-timer" id="timer">00:00</span>
                </div>
            </div>

            <div class="controls">
                <div class="source-selector">
                    <label>Source</label>
                    <div class="source-buttons">
                        <button class="source-btn active" data-source="screen" id="btnScreen">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                            <span>Écran</span>
                        </button>
                        <button class="source-btn" data-source="window" id="btnWindow">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                            <span>Fenêtre</span>
                        </button>
                        <button class="source-btn" data-source="tab" id="btnTab">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                            <span>Onglet</span>
                        </button>
                    </div>
                </div>

                <div class="options">
                    <label class="toggle-option">
                        <input type="checkbox" id="audioToggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Audio système</span>
                    </label>
                </div>

                <div class="action-buttons">
                    <button class="btn-primary" id="btnStart">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                        <span>Démarrer</span>
                    </button>
                    <button class="btn-secondary" id="btnStop" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2"/>
                        </svg>
                        <span>Arrêter</span>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>Fonctionne sur Chrome, Edge, Firefox | Les enregistrements restent sur votre appareil</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
